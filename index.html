<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ponto Eletrônico 44h</title>
    <!-- Importação do cliente do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Colaborador: Jonh Henrique Sena da Silva</h1>
    <h1>Relógio: <span id="relogio">00:00:00</span></h1>
    
    <button onclick="registrar('entrada')">Entrada</button>
    <button onclick="registrar('almocoSaida')">Saída Almoço</button>
    <button onclick="registrar('almocoRetorno')">Retorno Almoço</button>
    <button onclick="registrar('saida')">Saída</button>
    <button onclick="adicionarRetroativo()" style="background-color: yellow;">Incluir Retroativo</button>
    <button onclick="limparTudo()" style="color:red;">Limpar Tudo</button>

    <div style="margin-top:20px;">
        <label for="filtroMes">Filtrar por mês:</label>
        <select id="filtroMes" onchange="renderizarTabela()">
            <option value="todos">Todos os meses</option>
            <option value="01/2026">01/2026</option>
            <option value="02/2026">02/2026</option>
            <option value="03/2026">03/2026</option>
            <option value="04/2026">04/2026</option>
            <option value="05/2026">05/2026</option>
            <option value="06/2026">06/2026</option>
            <option value="07/2026">07/2026</option>
            <option value="08/2026">08/2026</option>
            <option value="09/2026">09/2026</option>
            <option value="10/2026">10/2026</option>
            <option value="11/2026">11/2026</option>
            <option value="12/2026">12/2026</option>
        </select>
    </div>

    <table border="1" style="margin-top:10px; width:100%;">
        <thead>
            <tr>
                <th>Data</th>
                <th>Entrada</th>
                <th>Saída Almoço</th>
                <th>Retorno Almoço</th>
                <th>Saída</th>
                <th>Status do Dia</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <script>
        // Configuração do Supabase (Substitua com as credenciais do seu projeto)
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const SENHA = "123456";
        const JORNADA_FIM = 16 * 60 + 20;

        // Relógio em tempo real
        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Carrega os dados assincronamente da tabela do banco de dados
        async function carregarPontosDoBanco() {
            const { data, error } = await supabase.from('pontos').select('*');
            if (error) {
                console.error('Erro ao carregar pontos:', error);
                return {};
            }
            const pontosObj = {};
            data.forEach(row => {
                pontosObj[row.data] = {
                    entrada: row.entrada,
                    almocoSaida: row.almoco_saida,
                    almocoRetorno: row.almoco_retorno,
                    saida: row.saida
                };
            });
            return pontosObj;
        }

        async function renderizarTabela() {
            const corpo = document.getElementById('corpoTabela');
            const filtro = document.getElementById('filtroMes').value;
            const pontos = await carregarPontosDoBanco();
            
            corpo.innerHTML = '';
            let saldoMensal = 0;

            Object.keys(pontos).sort((a, b) => {
                const [d1, m1, y1] = a.split('/').map(Number);
                const [d2, m2, y2] = b.split('/').map(Number);
                return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
            }).forEach(data => {
                const partes = data.split('/');
                const mesData = partes[1] + '/' + partes[2];
                if (filtro !== "todos" && mesData !== filtro) return;

                const p = pontos[data];
                const paraMin = (t) => (t === '-' || !t) ? 0 : (parseInt(t.split(':')[0]) * 60) + parseInt(t.split(':')[1]);
                const saidaMin = paraMin(p.saida);
                const [d, m, y] = data.split('/').map(Number);
                const diaSemana = new Date(y, m - 1, d).getDay();
                
                let status = "-";
                let cor = "black";

                if (diaSemana === 0 && p.entrada === '-') {
                    status = "Folga";
                } else if (p.entrada !== '-') {
                    if (saidaMin > 0) {
                        const extra = saidaMin - JORNADA_FIM;
                        saldoMensal += extra;
                        if (extra > 0) {
                            status = "Extra: " + Math.floor(extra/60) + "h " + (extra%60) + "m";
                            cor = "blue";
                        } else if (extra < 0) {
                            status = "Falta: " + Math.floor(Math.abs(extra)/60) + "h " + (Math.abs(extra)%60) + "m";
                            cor = "red";
                        } else {
                            status = "No horário";
                            cor = "green";
                        }
                    }
                }

                corpo.innerHTML += `<tr>
                    <td>${data}</td>
                    <td onclick="interagir('${data}', 'entrada')" style="cursor:pointer; color:blue;">${p.entrada}</td>
                    <td onclick="interagir('${data}', 'almocoSaida')" style="cursor:pointer; color:blue;">${p.almocoSaida}</td>
                    <td onclick="interagir('${data}', 'almocoRetorno')" style="cursor:pointer; color:blue;">${p.almocoRetorno}</td>
                    <td onclick="interagir('${data}', 'saida')" style="cursor:pointer; color:blue;">${p.saida}</td>
                    <td style="color:${cor}; font-weight:bold;">${status}</td>
                </tr>`;
            });

            const sinal = saldoMensal >= 0 ? '+' : '';
            corpo.innerHTML += `<tr style="background-color: #f0f0f0;">
                <td colspan="5" style="text-align:right; font-weight:bold;">Saldo Acumulado do Mês:</td>
                <td style="color:${saldoMensal >= 0 ? 'blue' : 'red'}; font-weight:bold;">
                    ${sinal}${Math.floor(Math.abs(saldoMensal)/60)}h ${Math.abs(saldoMensal)%60}m
                </td>
            </tr>`;
        }

        async function registrar(tipo) {
            const hoje = new Date();
            const dataKey = hoje.toLocaleDateString();
            const horaAtual = hoje.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const campoBanco = {
                'entrada': 'entrada',
                'almocoSaida': 'almoco_saida',
                'almocoRetorno': 'almoco_retorno',
                'saida': 'saida'
            }[tipo];

            const { data: existente } = await supabase.from('pontos').select('*').eq('data', dataKey).single();

            if (!existente) {
                const novoRegistro = { data: dataKey, entrada: '-', almoco_saida: '-', almoco_retorno: '-', saida: '-' };
                novoRegistro[campoBanco] = horaAtual;
                await supabase.from('pontos').insert([novoRegistro]);
            } else {
                const atualizacao = {};
                atualizacao[campoBanco] = horaAtual;
                await supabase.from('pontos').update(atualizacao).eq('data', dataKey);
            }

            renderizarTabela();
        }

        async function adicionarRetroativo() {
            if (prompt("Senha:") !== SENHA) return;
            const data = prompt("Digite a data (dd/mm/aaaa):");
            if (!data) return;

            const { data: existente } = await supabase.from('pontos').select('*').eq('data', data).single();
            if (!existente) {
                await supabase.from('pontos').insert([{ data: data, entrada: '-', almoco_saida: '-', almoco_retorno: '-', saida: '-' }]);
                renderizarTabela();
            } else {
                alert("Essa data já existe! Edite clicando no horário da tabela.");
            }
        }

        async function interagir(data, tipo) {
            if (prompt("Senha:") !== SENHA) return;
            const acao = prompt("Deseja [E]ditar ou [X]cluir?", "E");
            if (!acao) return;

            const campoBanco = {
                'entrada': 'entrada',
                'almocoSaida': 'almoco_saida',
                'almocoRetorno': 'almoco_retorno',
                'saida': 'saida'
            }[tipo];

            let novoHorario = '-';
            if (acao.toUpperCase() === 'E') {
                novoHorario = prompt("Novo horário (HH:MM):", "-");
                if (!novoHorario) return;
            }

            const atualizacao = {};
            atualizacao[campoBanco] = novoHorario;
            await supabase.from('pontos').update(atualizacao).eq('data', data);
            renderizarTabela();
        }

        async function limparTudo() {
            if (prompt("Senha:") === SENHA) {
                await supabase.from('pontos').delete().neq('id', 0);
                renderizarTabela();
            }
        }

        // Executa a renderização inicial ao carregar a página
        renderizarTabela();
    </script>
</body>
</html>
